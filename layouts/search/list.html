{{ define "main" }}
<div class="container">
    <div class="post-container">
        <h1 class="title">搜索</h1>
        <p>输入关键词搜索文章</p>
        
        <div class="search-box" style="margin: 2rem 0;">
            <input type="text" id="search-input" placeholder="搜索..." 
                   style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        
        <div id="search-results">
            {{ range (where .Site.Pages "Type" "post").ByDate.Reverse }}
            <div class="result-item" data-title="{{ .Title | lower }}">
                <span style="color: #888; margin-right: 10px;">{{ .Date.Format "2006-01-02" }}</span>
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            </div>
            {{ end }}
        </div>
    </div>
</div>

<script>
const input = document.getElementById('searchInput');
const items = document.querySelectorAll('.result-item');

if(input) {
    input.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        items.forEach(item => {
            const title = item.dataset.title;
            item.style.display = title.includes(q) ? 'block' : 'none';
        });
    });
}
</script>
{{ end }}
